<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Student form & table</title>
</head>
<body>
    <header>
        <h1>Student Registration Form</h1>
    </header>
    <main>
        <form>
            <section>
                <label for="">Full Name :</label>
                <br>
                <input type="text" placeholder="Enter your name" required>
                <br>
                <br>
                <label for="">Email :</label>
                <br>
                <input type="email" placeholder="Enter your email" required>
                <br>
                <br>
                <label for="">Password :</label>
                <br>
                <input type="password" required>
                <br>
                <br>
                <label for="" >Gender :</label>
                <br>
                <label for="male"><input type="radio" name="gender" id="male" required>Male</label>
                <label for="female"><input type="radio" name="gender" id="female" required>Female</label>
                <br>
                <br>
                <label for="">Skills :</label>
                <br>
                <label for="HTML" ><input type="checkbox" id="HTML" required>HTML</label>
                <label for="CSS" ><input type="checkbox" id="CSS" required>CSS</label>
                <label for="JavaScript" ><input type="checkbox" id="JavaScript" required>JavaScript</label>
                <br>
                <br>
                <label for="">Date-Of-Birth :</label>
                <br>
                <input type="date" required>
                <br>
                <br>
                <button type="submit">Register</button>
            </section>
        </form>
        <hr>
        <section>
            <h1>Submitted Students (Dummy Data)</h1>
            <table border="2" cellPadding=9">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Gender</th>
                    <th>Skills</th>
                    <th>DOB</th>
                </tr>
                <tr>
                    <td>Bala</td>
                    <td>balsingh@gmail.com</td>
                    <td>Male</td>
                    <td>Java Full Stack Developer</td>
                    <td>13.01.2002</td>
                </tr>
                <tr>
                    <td>Sindhu</td>
                    <td>sindhu@gmail.com</td>
                    <td>Female</td>
                    <td>Content Creator</td>
                    <td>20.08.2002</td>
                </tr>
            </table>
        </section>
    </main>
</body>
</html>
